name: Verify starter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - name: Smoke test packaged backend over HTTP
        timeout-minutes: 5
        shell: bash
        run: |
          java -jar backend/target/heat-network-routing-0.1.0-SNAPSHOT.jar \
            --server.address=127.0.0.1 --server.port=18080 \
            --heat-network.jobs.storage-directory="$RUNNER_TEMP/smoke-jobs" \
            --heat-network.input.storage-directory="$RUNNER_TEMP/smoke-datasets" \
            > "$RUNNER_TEMP/api-smoke-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --silent --fail --max-time 1 http://127.0.0.1:18080/api/health > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/api-smoke-server.log"
            exit 1
          fi
          python scripts/smoke_api.py --base-url http://127.0.0.1:18080 \
            --require-full-connection --report "$RUNNER_TEMP/api-smoke.json" || {
              cat "$RUNNER_TEMP/api-smoke-server.log"
              exit 1
            }
      - run: python -m pip install -r scripts/requirements-checks.txt
      - run: python -m openapi_spec_validator contracts/openapi.json
      - run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build -- --mode development
