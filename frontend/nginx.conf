# Frontend on :80; /api and the Swagger UI are proxied to the backend service in the same Compose network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads up to 3 GiB and GeoJSON results up to 500 MB are streamed straight through, without
    # temporary files in nginx. The backend enforces the size limit and answers with its JSON 413.
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    # Hashed build assets never change; the page itself is always revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
