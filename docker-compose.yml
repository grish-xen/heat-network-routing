version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HEATNETWORK_JOBS_STORAGEDIRECTORY: /var/lib/heat-network/jobs
      # Job statuses and variant summaries are stored in PostgreSQL; large files stay in job-data.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/heat_network
      SPRING_DATASOURCE_USERNAME: heat_network
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - job-data:/var/lib/heat-network/jobs
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # Web interface: http://127.0.0.1:8081 by default. FRONTEND_BIND=0.0.0.0 opens it to other hosts.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heat_network
      POSTGRES_USER: heat_network
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heat_network -d heat_network"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  job-data:
