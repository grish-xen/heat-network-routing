# Large multipart bodies are configured in JobConfiguration; they are spooled to disk.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Allow Tomcat to drain a rejected upload and deliver the JSON 413 response.
server.tomcat.max-swallow-size=-1
# PostgreSQL job metadata is enabled by spring.datasource.url (see DatabaseConfiguration); without it the
# backend keeps metadata as JSON files, so the default DataSource auto-configuration is not used.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
